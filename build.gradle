// --- Mixin plugin (buildscript scope for Gradle plugins) ---
buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

// Enable Sponge Mixin Gradle plugin for this project
apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // mappings come from gradle.properties (mapping_channel/mapping_version)
    mappings channel: mapping_channel, version: mapping_version

    // Required so ProcessResources runs before IDE launches
    copyIdeResources = true

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            // flag so mod code can detect datagen
            property 'chippedexttras.datagen', 'true'
            // keep your args
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
            // optional: easier debugging
            jvmArgs '-Dforge.logging.console.level=debug'
        }
    }
}

// --- Mixin Gradle configuration ---
// Ensure you have exactly ONE file at: src/main/resources/${mod_id}.mixins.json
// Example name for this project: src/main/resources/chippedexttras.mixins.json
mixin {
    // The refmap that gets written into your classes at compile time
    add sourceSets.main, "${mod_id}.refmap.json"

    // Your mixin configuration JSON (lives in src/main/resources)
    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators at runtime and in the jar.
sourceSets {
    main {
        resources {
            // Order matters a bit; generated first lets main override if needed
            srcDir 'src/generated/resources'
            srcDir 'src/main/resources'
        }
    }
}

repositories {
    // ForgeGradle adds the Forge maven and Maven Central automatically
    // Additional repos for dependencies go here

    // ✅ CurseMaven for Chipped and friends
    maven { url = 'https://cursemaven.com' }
}

dependencies {
    // Forge (MC + Forge version come from gradle.properties as minecraft_version/forge_version)
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Sponge Mixin annotation processor (required when using mixins)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // ✅ Chipped + dependencies (Forge 1.20.1 IDs used in your example)
    implementation fg.deobf("curse.maven:chipped-456956:5813138")
    implementation fg.deobf("curse.maven:resourceful-lib-570073:5659871")
    implementation fg.deobf("curse.maven:athena-841890:5176879")

    // If you don't compile against Chipped API directly, you could instead use:
    // runtimeOnly fg.deobf("curse.maven:chipped-456956:5813138")
}

// This block expands declared replace properties in resource files.
// When "copyIdeResources" is enabled, this also runs before launches in IDE.
import org.gradle.api.file.DuplicatesStrategy
import org.gradle.language.jvm.tasks.ProcessResources

tasks.named('processResources', ProcessResources).configure {
    // 🔧 Critical: set a task-level strategy to ignore duplicates across ALL sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // (Optional) also keep explicit strategies for each source, harmless to leave
    from('src/generated/resources') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
    from('src/main/resources')     { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

    // Property expansion
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example of adding manifest info and reobfuscation
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"   : mod_id,
                "Specification-Vendor"  : mod_authors,
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor" : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    // Reobfuscate the jar after building
    finalizedBy 'reobfJar'
}



tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
